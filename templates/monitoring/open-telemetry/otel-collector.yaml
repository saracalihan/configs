receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    const_labels:
      environment: "production"
  debug:
    verbosity: detailed
  opensearch:
    http:
      endpoint: http://opensearch:9200
      compression: gzip
    logs_index: otel-logs

service:
  pipelines:
    metrics:
      receivers: [otlp]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      exporters: [opensearch]
